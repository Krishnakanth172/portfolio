<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Projects | Krishna Kanth Kodanganti</title>

    <link rel="stylesheet" href="../style.css">
</head>


<body>

    <!-- ==================================================
         Page Header
    =================================================== -->

    <header>

        <h1 class="projects-title">Projects</h1>

        <p>
            Selected projects in artificial intelligence, machine learning,
            data engineering, model evaluation, and production ML systems.
        </p>

    </header>


    <!-- ==================================================
         Lab 5: Projects by Year Visualization
    =================================================== -->

    <div class="projects-chart-container">

        <svg
            id="projects-pie-plot"
            viewBox="-50 -50 100 100"
            role="group"
            aria-label="Pie chart showing projects by year"
        >
        </svg>

        <ul
            class="legend"
            aria-label="Projects by year legend"
        ></ul>

    </div>


    <!-- ==================================================
         Search
    =================================================== -->

    <input
        class="searchBar"
        type="search"
        aria-label="Search projects"
        placeholder="🔍 Search projects..."
    >


    <!-- ==================================================
         Projects Grid
    =================================================== -->

    <section class="projects">
    </section>


    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>

</body>

</html>
